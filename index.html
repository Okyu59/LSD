<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LSD Loop Runner: Night Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#ccff00', // Neon Lime (Volt)
                            dark: '#aacc00',
                            bg: '#0f172a', 
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    // Add safe area utilities
                    padding: {
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                    }
                }
            }
        }
    </script>
    
    <!-- React & Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        /* Core Reset */
        html, body { 
            height: 100%; 
            width: 100%; 
            margin: 0; 
            padding: 0;
            overflow: hidden; /* Prevent body scroll */
            background-color: #000;
            font-family: 'Inter', sans-serif;
            color: white;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dynamic Viewport Height Fix */
        #root {
            height: 100dvh; /* dynamic viewport height */
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Neon Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%;
            background: #ccff00; margin-top: -12px; 
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.5); 
            border: 4px solid #1e293b;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
        }
        
        .leaflet-container { width: 100%; height: 100%; background: #111; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_KEY = "cd160bc2-0beb-4394-b713-29b69b378e6e";
        
        // --- Utilities & Icons (Same as before) ---
        const DIFFICULTY = {
            FLAT: { label: 'FLAT', color: 'text-brand border-brand bg-brand/10' },
            MODERATE: { label: 'MODERATE', color: 'text-orange-400 border-orange-400 bg-orange-400/10' },
            HILLY: { label: 'HILLY', color: 'text-red-500 border-red-500 bg-red-500/10' }
        };
        const calculateDifficulty = (dist, asc) => {
            if (!dist) return DIFFICULTY.FLAT;
            const r = asc / dist;
            return r < 8 ? DIFFICULTY.FLAT : r < 15 ? DIFFICULTY.MODERATE : DIFFICULTY.HILLY;
        };
        const getPaceString = (s) => `${Math.floor(s/60)}'${(s%60).toString().padStart(2,'0')}"`;

        const Icons = {
            mapPin: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
            crosshair: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>,
            route: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H19"/></svg>,
            timer: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            settings: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            refresh: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            download: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            trendingUp: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            arrowRight: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
            loader: <svg className="animate-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        };

        const Icon = ({ name, className }) => React.cloneElement(Icons[name], { className: className || '', width: 20, height: 20 });

        // --- Components ---
        const MapView = ({ route, startLocation }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const layerGroupRef = useRef(null);

            useEffect(() => {
                if (!mapInstanceRef.current && mapRef.current) {
                    const map = L.map(mapRef.current, { zoomControl: false, attributionControl: false }).setView([startLocation.lat, startLocation.lng], 13);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
                    layerGroupRef.current = L.layerGroup().addTo(map);
                    mapInstanceRef.current = map;
                }
                return () => {
                    if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; }
                }
            }, []);

            useEffect(() => {
                if (mapInstanceRef.current && layerGroupRef.current) {
                    const group = layerGroupRef.current;
                    group.clearLayers();
                    
                    const pulseIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div style="background-color: #ccff00; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 15px #ccff00;"></div>`,
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    });
                    L.marker([startLocation.lat, startLocation.lng], { icon: pulseIcon }).addTo(group);

                    if (route?.points?.coordinates) {
                        const latlngs = route.points.coordinates.map(c => [c[1], c[0]]);
                        L.polyline(latlngs, { color: '#ccff00', weight: 5, opacity: 0.9 }).addTo(group);
                        mapInstanceRef.current.fitBounds(L.polyline(latlngs).getBounds(), { padding: [80, 80] });
                    } else {
                        mapInstanceRef.current.setView([startLocation.lat, startLocation.lng], 14);
                    }
                }
            }, [startLocation, route]);

            return <div ref={mapRef} className="w-full h-full bg-[#111]"></div>;
        };

        const ElevationProfile = ({ points }) => {
            if (!points || points.length === 0) return null;
            try {
                const sample = Math.max(1, Math.floor(points.length / 40));
                const data = points.filter((_, i) => i % sample === 0).map(p => p[2] || 0);
                if (data.length === 0) return null;
                const min = Math.min(...data), max = Math.max(...data), range = (max - min) || 10;
                return (
                    <div className="h-12 w-full flex items-end gap-[2px] mt-4 opacity-80">
                        {data.map((h, i) => (
                            <div key={i} className="flex-1 bg-brand rounded-t-[1px]" 
                                 style={{ height: `${Math.max(10, ((h-min)/range)*100)}%`, opacity: 0.3 + (0.7*((h-min)/range)) }}></div>
                        ))}
                    </div>
                );
            } catch { return null; }
        };

        const App = () => {
            const [location, setLocation] = useState({ lat: 37.5665, lng: 126.9780, name: '서울시청' });
            const [distance, setDistance] = useState(10);
            const [pace, setPace] = useState(330);
            const [routes, setRoutes] = useState([]);
            const [selectedIdx, setSelectedIdx] = useState(0);
            const [loading, setLoading] = useState(false);
            const [view, setView] = useState('input');

            const handleGeoLocation = () => {
                setLoading(true);
                if (!navigator.geolocation) { setLoading(false); return; }
                navigator.geolocation.getCurrentPosition(
                    (p) => { setLocation({ lat: p.coords.latitude, lng: p.coords.longitude, name: '현재 위치' }); setLoading(false); },
                    () => { setLoading(false); }
                );
            };

            const findCourses = async () => {
                setLoading(true); setRoutes([]);
                const seeds = [100, 200, 300];
                try {
                    const res = await Promise.all(seeds.map(s => 
                        fetch(`https://graphhopper.com/api/1/route?point=${location.lat},${location.lng}&vehicle=foot&algorithm=round_trip&round_trip.distance=${distance * 1000}&round_trip.seed=${s}&elevation=true&points_encoded=false&key=${API_KEY}`).then(r => r.ok ? r.json() : null)
                    ));
                    const valid = res.filter(r => r?.paths?.[0]).map((r, i) => ({ ...r.paths[0], id: i }));
                    if (valid.length > 0) {
                        valid.sort((a, b) => (a.ascend/a.distance) - (b.ascend/b.distance));
                        setRoutes(valid); setSelectedIdx(0); setView('result');
                    }
                } catch {} finally { setLoading(false); }
            };

            const downloadGPX = (route) => {
                if(!route) return;
                const name = `LSD_${(route.distance/1000).toFixed(1)}km`;
                let gpx = `<?xml version="1.0"?><gpx version="1.1"><trk><name>${name}</name><trkseg>`;
                route.points.coordinates.forEach(p => gpx += `<trkpt lat="${p[1]}" lon="${p[0]}"><ele>${p[2]||0}</ele></trkpt>`);
                gpx += `</trkseg></trk></gpx>`;
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'})));
                link.download = `${name}.gpx`;
                link.click();
            };

            const selectedRoute = routes[selectedIdx];
            const diff = selectedRoute ? calculateDifficulty(selectedRoute.distance/1000, selectedRoute.ascend) : DIFFICULTY.FLAT;

            return (
                <div className="flex flex-col h-full relative font-sans bg-black">
                    {/* Header */}
                    <div className="absolute top-0 left-0 right-0 z-20 p-safe-pt pt-6 px-5 pointer-events-none">
                        <div className="flex justify-between items-center pointer-events-auto">
                            <h1 className="text-2xl font-black italic tracking-tighter text-white drop-shadow-md">
                                <span className="text-brand">LSD</span> RUNNER
                            </h1>
                            {view === 'result' && (
                                <button onClick={() => setView('input')} className="bg-black/40 backdrop-blur p-2 rounded-full border border-white/10 text-white">
                                    <Icon name="settings" />
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Map */}
                    <div className="flex-1 relative z-0">
                        <MapView startLocation={location} route={view === 'result' ? selectedRoute : null} />
                        <div className="absolute inset-0 pointer-events-none bg-gradient-to-t from-black via-transparent to-transparent z-10 opacity-60"></div>
                    </div>

                    {/* Input Bottom Sheet */}
                    {view === 'input' && (
                        <div className="absolute bottom-0 left-0 right-0 z-30 flex flex-col justify-end pointer-events-none">
                            <div className="bg-gray-900/95 backdrop-blur-xl rounded-t-[2rem] p-6 pb-safe-bottom pt-8 shadow-2xl border-t border-white/10 pointer-events-auto animate-slide-up max-h-[85vh] overflow-y-auto">
                                <div className="w-12 h-1 bg-white/20 rounded-full mx-auto mb-8 shrink-0"></div>
                                
                                <div className="space-y-8">
                                    {/* Location */}
                                    <div>
                                        <label className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider flex items-center gap-2">
                                            <Icon name="mapPin" className="text-brand" /> Start
                                        </label>
                                        <div className="flex gap-3">
                                            <div className="flex-1 bg-black/50 border border-white/10 rounded-2xl px-4 py-4 flex items-center text-white min-w-0">
                                                <div className="font-mono text-sm truncate">{location.name}</div>
                                            </div>
                                            <button onClick={handleGeoLocation} className="bg-brand text-black w-14 shrink-0 rounded-2xl flex items-center justify-center hover:bg-white transition-colors">
                                                <Icon name="crosshair" />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Distance */}
                                    <div>
                                        <div className="flex justify-between items-end mb-4">
                                            <label className="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                                                <Icon name="route" className="text-brand" /> Distance
                                            </label>
                                            <span className="text-4xl font-black italic text-white tracking-tighter">{distance}<span className="text-lg font-medium text-gray-500 not-italic ml-1">km</span></span>
                                        </div>
                                        <input type="range" min="5" max="30" step="1" value={distance} onChange={(e) => setDistance(parseInt(e.target.value))} />
                                        <div className="flex justify-between text-[10px] font-mono text-gray-500 mt-3">
                                            <span>5K</span><span>30K</span>
                                        </div>
                                    </div>

                                    {/* Pace */}
                                    <div>
                                        <div className="flex justify-between items-end mb-4">
                                            <label className="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                                                <Icon name="timer" className="text-brand" /> Pace
                                            </label>
                                            <span className="text-2xl font-bold font-mono text-white">{getPaceString(pace)}</span>
                                        </div>
                                        <div className="flex gap-2 overflow-x-auto pb-2 hide-scrollbar -mx-2 px-2">
                                            {[270, 300, 330, 360, 390, 420, 450].map((p) => (
                                                <button key={p} onClick={() => setPace(p)} 
                                                    className={`flex-shrink-0 px-4 py-3 rounded-xl font-mono text-sm font-bold border ${pace === p ? 'bg-white text-black border-white' : 'bg-transparent text-gray-500 border-white/10'}`}>
                                                    {getPaceString(p)}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <button onClick={findCourses} disabled={loading} className="w-full bg-brand text-black font-black text-lg h-14 rounded-2xl shadow-lg hover:bg-white active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:bg-gray-700 disabled:text-gray-500 uppercase mb-4">
                                        {loading ? <Icon name="loader" /> : <>FIND ROUTE <Icon name="arrowRight" /></>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Result Overlay */}
                    {view === 'result' && routes.length > 0 && (
                        <div className="absolute bottom-0 left-0 right-0 z-30 pb-safe-bottom pt-4 px-4 bg-gradient-to-t from-black via-black/80 to-transparent">
                            <div className="flex gap-4 overflow-x-auto pb-4 hide-scrollbar snap-x mb-4">
                                {routes.map((route, idx) => {
                                    const d = calculateDifficulty(route.distance/1000, route.ascend);
                                    const isSel = selectedIdx === idx;
                                    return (
                                        <div key={idx} onClick={() => setSelectedIdx(idx)} 
                                            className={`flex-shrink-0 w-[85%] max-w-[340px] bg-gray-900/90 backdrop-blur rounded-3xl p-5 border transition-all cursor-pointer snap-center relative overflow-hidden ${isSel ? 'border-brand' : 'border-white/10 opacity-70'}`}>
                                            <div className="flex justify-between items-start mb-4 relative z-10">
                                                <span className={`text-[10px] font-black px-2 py-1 rounded uppercase tracking-widest border ${d.color}`}>{d.label}</span>
                                                {isSel && <div className="bg-brand text-black text-[10px] font-black px-2 py-1 rounded">PICK</div>}
                                            </div>
                                            <div className="flex justify-between items-end mb-4 relative z-10">
                                                <div>
                                                    <div className="text-4xl font-black italic text-white tracking-tighter">{(route.distance / 1000).toFixed(1)}<span className="text-sm text-gray-500 font-bold ml-1">KM</span></div>
                                                    <div className="text-sm text-gray-400 mt-1 font-mono">~ {Math.floor(((route.distance/1000)*pace)/60)} min</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-[10px] text-gray-500 font-bold uppercase mb-1">Elevation</div>
                                                    <div className="text-lg font-bold text-white flex items-center justify-end gap-1 font-mono"><Icon name="trendingUp" className="text-brand" />{route.ascend.toFixed(0)}m</div>
                                                </div>
                                            </div>
                                            <div className="relative z-10"><ElevationProfile points={route.points.coordinates} /></div>
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="flex gap-3 pb-4">
                                <button onClick={findCourses} className="flex-1 bg-white/10 backdrop-blur text-white font-bold h-12 rounded-xl border border-white/10 flex items-center justify-center gap-2 text-sm uppercase"><Icon name="refresh" /> Retry</button>
                                <button onClick={() => downloadGPX(selectedRoute)} className="flex-[2] bg-brand text-black font-black h-12 rounded-xl shadow-lg flex items-center justify-center gap-2 text-sm uppercase"><Icon name="download" /> GPX Export</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
